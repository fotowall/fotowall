name: CI of fotowall

on:
  push:
    paths-ignore: &paths-ignore
      # Changes to those files don't mandate running CI
      - ".github/workflows/package.yml"
      - ".github/workflows/sources/*"
      - ".github/workflows/build-others.yml"
      - ".github/workflows/docker/*"
      - "debian/**"
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    paths-ignore: *paths-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag-precheck:
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.validate.outputs.is_valid }}
    steps:
      - name: Skip precheck on non-tag refs
        if: github.ref_type != 'tag'
        run: echo "Tag precheck skipped for non-tag ref ${GITHUB_REF}."

      - uses: actions/checkout@v7
        with:
          submodules: recursive
        if: github.ref_type == 'tag'

      - name: Install uv
        if: github.ref_type == 'tag'
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install jrl-cmakemodules-scripts
        if: github.ref_type == 'tag'
        run: |
          uv tool install jrl-cmakemodules-scripts --from git+https://github.com/jrl-umi3218/jrl-cmakemodules.git#subdirectory=v2/scripts

      - name: Validate release tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "is_valid=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TAG="${GITHUB_REF_NAME}"
          if jrl-release --check-version --check-tag "$RELEASE_TAG"; then
            echo "is_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag '$RELEASE_TAG' failed jrl-release validation. Fix PROJECT_VERSION/debian changelog to match the tag."
            exit 1
          fi

  build:
    needs: tag-precheck
    if: needs.tag-precheck.outputs.is_valid == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
        build-type: [RelWithDebInfo, Release]
        compiler: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install dependencies (Qt5)
      if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04'
      uses: jrl-umi3218/github-actions/install-dependencies@master
      with:
        compiler: ${{ matrix.compiler }}
        build-type: ${{ matrix.build-type }}
        ubuntu: |
          apt: qtbase5-dev libqt5svg5-dev libqt5webkit5-dev
    - name: Install dependencies (Qt6)
      if: matrix.os == 'ubuntu-26.04'
      uses: jrl-umi3218/github-actions/install-dependencies@master
      with:
        compiler: ${{ matrix.compiler }}
        build-type: ${{ matrix.build-type }}
        ubuntu: |
          apt: qt6-base-dev qt6-svg-dev
    - name: Build and test
      uses: jrl-umi3218/github-actions/build-cmake-project@master
      with:
        compiler: ${{ matrix.compiler }}
        build-type: ${{ matrix.build-type }}
