name: Package - Debian
on:
  repository_dispatch:
    types:
    - package-master
    - package-release
  push:
    paths-ignore: &path-ignore
    - doc/**
    - README.md
    - ".github/workflows/build.yml"
    - ".github/workflows/webassembly.yml"
    - ".pre-commit-config.yaml"
    branches:
    - master
    tags:
    - v*
  pull_request:
    paths-ignore: *path-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package-qt5:
    uses: jrl-umi3218/github-actions/.github/workflows/package-project.yml@master
    with:
      latest-cmake: true
      matrix: |
          {
            "dist": ["jammy", "noble" ],
            "arch": ["amd64"]
          }
      head-repo: "arntanguy/head"
      stable-repo: "arntanguy/stable"
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
  package-qt6:
    uses: jrl-umi3218/github-actions/.github/workflows/package-project.yml@master
    with:
      latest-cmake: true
      matrix: |
          {
            "dist": ["resolute"],
            "arch": ["amd64"]
          }
      head-repo: "arntanguy/head"
      stable-repo: "arntanguy/stable"
      control-file: 'debian/control.qt6'
    secrets:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
