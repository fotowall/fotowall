name: Windows Release

on:
  pull_request:
    branches:
      - 'master'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version coherency
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -x
          export RELEASE_TAG=`echo ${{ github.ref }} | sed -e 's@refs/tags/@@'`
          jrl-release --check-version --check-tag $RELEASE_TAG

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install jrl-cmakemodules-scripts
        run: |
          uv tool install jrl-cmakemodules-scripts --from git+https://github.com/jrl-umi3218/jrl-cmakemodules.git#subdirectory=v2/scripts

      - name: Check version coherency
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -x
          export RELEASE_TAG=`echo ${{ github.ref }} | sed -e 's@refs/tags/@@'`
          jrl-release --check-version --check-tag $RELEASE_TAG

      - name: Install Qt (Qt6)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build . --config Release

      - name: Prepare dist directory
        run: |
          mkdir dist
          copy Release\fotowall.exe dist\

      - name: Deploy Qt DLLs
        run: |
          windeployqt dist\fotowall.exe

      - name: Smoke test bundled executable
        run: |
          $proc = Start-Process -FilePath "dist\fotowall.exe" `
            -ArgumentList "" `
            -Environment @{ QT_QPA_PLATFORM = "offscreen" } `
            -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            Write-Error "fotowall.exe exited with code $($proc.ExitCode) — possible missing DLLs or startup crash"
            exit 1
          }
          if (-not $proc.HasExited) {
            $proc.Kill()
          }
          Write-Host "Smoke test passed"

      - name: Create zip archive
        run: |
          Compress-Archive -Path dist\* -DestinationPath fotowall-windows.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotowall-windows
          path: fotowall-windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fotowall-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
