name: Package - Windows

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  tag-precheck:
    runs-on: ubuntu-latest
    outputs:
      is_valid: ${{ steps.validate.outputs.is_valid }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install jrl-cmakemodules-scripts
        run: |
          uv tool install jrl-cmakemodules-scripts --from git+https://github.com/jrl-umi3218/jrl-cmakemodules.git#subdirectory=v2/scripts

      - name: Validate release tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if jrl-release --check-version --check-tag "$RELEASE_TAG"; then
            echo "is_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag '$RELEASE_TAG' failed jrl-release validation. Fix PROJECT_VERSION/debian changelog to match the tag."
            exit 1
          fi

  package-windows:
    needs: tag-precheck
    if: needs.tag-precheck.outputs.is_valid == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt (Qt6)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build . --config Release

      - name: Prepare dist directory
        run: |
          mkdir dist
          copy Release\fotowall.exe dist\

      - name: Deploy Qt DLLs
        run: |
          windeployqt dist\fotowall.exe

      - name: Smoke test bundled executable
        run: |
          $proc = Start-Process -FilePath "dist\fotowall.exe" `
            -ArgumentList "" `
            -Environment @{ QT_QPA_PLATFORM = "offscreen" } `
            -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            Write-Error "fotowall.exe exited with code $($proc.ExitCode) — possible missing DLLs or startup crash"
            exit 1
          }
          if (-not $proc.HasExited) {
            $proc.Kill()
          }
          Write-Host "Smoke test passed"

      - name: Create zip archive
        run: |
          Compress-Archive -Path dist\* -DestinationPath fotowall-windows.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fotowall-windows
          path: fotowall-windows.zip

      - name: Ensure GitHub release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Release $tag" --notes ""
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag *> $null
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to create or find release for tag $tag"
              }
            }
          }

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          gh release upload $tag "fotowall-windows.zip#fotowall-windows.zip" --clobber
