name: Package - AppImage
on:
  repository_dispatch:
    types:
    - package-master
    - package-release
  push:
    paths-ignore: &path-ignore
    - doc/**
    - README.md
    - ".github/workflows/build.yml"
    - ".github/workflows/webassembly.yml"
    - ".pre-commit-config.yaml"
    branches:
    - master
    tags:
    - v*
  pull_request:
    paths-ignore: *path-ignore
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    outputs:
      os: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install dependencies
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen qtbase5-dev libqt5svg5-dev libqt5webkit5-dev
      - name: install dependencies (qt6)
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen qt6-base-dev qt6-svg-dev
      - name: configure
        run: cmake . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: build
        run: make -j`nproc`  install DESTDIR=AppDir
      - name: Configure AppImageBuilder.yml (qt5)
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04'
        run: |
          sed "s|focal|`lsb_release -cs`|g" AppImageBuilder-qt5.yml > AppImageBuilder.yml
          if [[ "`lsb_release -cs`" == 'focal' ]]
          then
            sed -i "s|KEY_URL|http://keyserver.ubuntu.com/pks/lookup?op=get\&search=0x3b4fe6acc0b21f32|g" AppImageBuilder.yml
          elif [[ "`lsb_release -cs`" == 'jammy' ]]
          then
            sed -i "s|KEY_URL|http://keyserver.ubuntu.com/pks/lookup?op=get\&search=0x871920D1991BC93C|g" AppImageBuilder.yml
          elif [[ "`lsb_release -cs`" == 'noble' ]]
          then
            sed -i "s|KEY_URL|http://keyserver.ubuntu.com/pks/lookup?op=get\&search=0x871920D1991BC93C|g" AppImageBuilder.yml
          fi
          echo "Using the following AppImageBuilder.yml:"
          cat AppImageBuilder.yml
      - name: Configure AppImageBuilder.yml (qt6)
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sed "s|noble|`lsb_release -cs`|g" AppImageBuilder-qt6.yml > AppImageBuilder.yml
          sed -i "s|KEY_URL|http://keyserver.ubuntu.com/pks/lookup?op=get\&search=0x871920D1991BC93C|g" AppImageBuilder.yml
          echo "Using the following AppImageBuilder.yml:"
      - name: Build AppImage
        uses: AppImageCrafters/build-appimage-action@master
        env:
          UPDATE_INFO: gh-releases-zsync|AppImageCrafters|fotowall|latest|*x86_64.AppImage.zsync
        with:
          recipe: AppImageBuilder.yml
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fotowall-latest-x86_64-${{ matrix.os }}
          path: |
            ./Fotowall-latest-x86_64.AppImage
            ./Fotowall-latest-x86_64.AppImage.zsync
          if-no-files-found: error

  smoketest:
    needs: build
    runs-on: ${{ needs.build.outputs.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: Fotowall-latest-x86_64-${{ needs.build.outputs.os }}
      - name: Smoke test AppImage
        id: appimage-smoke-test
        run: |
          cp ./Fotowall-latest-x86_64.AppImage /tmp/Fotowall-latest-x86_64.AppImage
          chmod +x /tmp/Fotowall-latest-x86_64.AppImage
          /tmp/Fotowall-latest-x86_64.AppImage --appimage-extract
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/fotowall
          ! ldd squashfs-root/usr/bin/fotowall | grep -q "not found"
      - name: Upload tested AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fotowall-latest-x86_64-${{ needs.build.outputs.os }}-tested
          path: |
            ./Fotowall-latest-x86_64.AppImage
            ./Fotowall-latest-x86_64.AppImage.zsync
          if-no-files-found: error

  upload:
    needs: smoketest
    runs-on: ${{ needs.build.outputs.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download tested AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: Fotowall-latest-x86_64-${{ needs.build.outputs.os }}-tested
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fotowall-latest-x86_64-${{ needs.build.outputs.os }}
          path: |
            ./Fotowall-latest-x86_64.AppImage
            ./Fotowall-latest-x86_64.AppImage.zsync
          if-no-files-found: error
      - name: Install and Authenticate Cloudsmith CLI
        if: github.ref == 'refs/heads/master' && github.repository == 'fotowall/fotowall'
        uses: cloudsmith-io/cloudsmith-cli-action@v2.0.3
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
      - name: Push to Cloudsmith
        id: push
        if: github.ref == 'refs/heads/master' && github.repository == 'fotowall/fotowall'
        run: |
          cloudsmith push raw arntanguy/head "./Fotowall-latest-x86_64.AppImage" \
            --tags "`lsb_release -cs`" \
            --name "Fotowall-latest-x86_64-${{ needs.build.outputs.os }}.AppImage" \
            --summary "Upload latest raw AppImage" \
            --description "See https://github.com/cloudsmith-io/action" \
            --version "${{ github.sha }}" \
            --republish
